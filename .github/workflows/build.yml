name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the Create release step to publish releases/tags.
permissions:
  contents: write

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
# Tags/branches are distinct refs, so release builds are never cancelled by a
# branch build and vice-versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OF_VERSION: "0.12.0"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout DuneBox
        uses: actions/checkout@v5
        with:
          path: project
          lfs: true

      - name: Cache OpenFrameworks
        id: cache-of
        uses: actions/cache@v5
        with:
          path: openFrameworks
          key: of-${{ env.OF_VERSION }}-win-vs

      - name: Download OpenFrameworks
        if: steps.cache-of.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $url = "https://github.com/openframeworks/openFrameworks/releases/download/${{ env.OF_VERSION }}/of_v${{ env.OF_VERSION }}_vs_release.zip"
          Invoke-WebRequest -Uri $url -OutFile of.zip -UseBasicParsing
          Expand-Archive -Path of.zip -DestinationPath of_temp
          $dir = Get-ChildItem of_temp -Directory | Select-Object -First 1
          Move-Item $dir.FullName openFrameworks
          Remove-Item of_temp -Recurse -Force
          Remove-Item of.zip

      - name: Install addons
        shell: bash
        run: |
          set -e
          cd openFrameworks/addons
          # These four community addons live inside the cached OF tree, so wipe and
          # re-clone for a deterministic state (a cache hit may hold older versions).
          rm -rf ofxCv ofxDatGui ofxParagraph ofxModal
          # Pin every addon to a specific commit for reproducible builds (the app
          # depends on specific addon APIs; floating HEAD could break CI silently).
          clone_pin() { git clone -q "https://github.com/$1" "$2" && git -C "$2" checkout -q "$3"; }
          clone_pin kylemcdonald/ofxCv        ofxCv        209a3986a8f8e1928c7a11f6e1c5d8ea5406e639
          clone_pin braitsch/ofxParagraph     ofxParagraph 41dbfd2e07e00e358629d470dd1b6f986dee2b70
          clone_pin braitsch/ofxModal         ofxModal     71bfaa283407bbe58b921fd581d8665f21cf5eb8
          # ofxDatGui: the thomwolf fork matches Magic-Sand's exact API
          # (ScrollView::get(int), 3-arg ScrollViewEvent, setOptions).
          clone_pin thomwolf/ofxDatGui        ofxDatGui    0c2230afa68fe5dea822932f6b4c178778af9440
          # OF 0.12 removed `using namespace std;` from its headers; ofxDatGui
          # (0.9-era) relies on it via unqualified string/vector/shared_ptr in its
          # OWN headers. Re-introduce it per addon header so it compiles on OF 0.12.
          find ofxDatGui/src -name '*.h' -print0 \
            | xargs -0 sed -i 's/#pragma once/#pragma once\nusing namespace std;/'

      - name: Place project in OF tree
        shell: bash
        run: |
          mkdir -p openFrameworks/apps/myApps
          cp -r project openFrameworks/apps/myApps/Magic-Sand
          # Defensive: drop any committed IDE project files so projectGenerator
          # always builds a clean OF 0.12 one (correct OpenCV 4.x / libusb-1.0 /
          # freenect wiring). The repo no longer ships these, but guard anyway.
          rm -f openFrameworks/apps/myApps/Magic-Sand/Magic-Sand.sln \
                openFrameworks/apps/myApps/Magic-Sand/Magic-Sand.vcxproj \
                openFrameworks/apps/myApps/Magic-Sand/Magic-Sand.vcxproj.filters

      - name: Regenerate VS project for OF 0.12
        shell: pwsh
        run: |
          $of = (Resolve-Path openFrameworks).Path
          $app = Join-Path $of "apps\myApps\Magic-Sand"
          $cands = Get-ChildItem -Path $of -Recurse -Filter projectGenerator.exe -ErrorAction SilentlyContinue
          Write-Host "projectGenerator.exe candidates:"; $cands | ForEach-Object { Write-Host "  $($_.FullName)" }
          # Pick the headless commandline binary (…\resources\app\app\projectGenerator.exe),
          # NOT the Electron GUI launcher (…\projectGenerator\projectGenerator.exe) which would hang.
          $pg = $cands | Where-Object { $_.FullName -match 'resources[\\/]app[\\/]app' } | Select-Object -First 1
          if (-not $pg) { $pg = $cands | Where-Object { $_.FullName -match 'resources' } | Select-Object -First 1 }
          if (-not $pg) { Write-Error "headless projectGenerator.exe not found in the OF release"; exit 1 }
          Write-Host "Using projectGenerator: $($pg.FullName)"
          # PG uses the Lean Mean C++ Option Parser: long options need the GNU
          # "--key=value" form (a leading "/" or a space-separated value is parsed
          # as the positional project path instead). The VS platform token is "vs".
          & $pg.FullName "--ofPath=$of" "--platforms=vs" "$app" 2>&1 | Write-Host
          Write-Host "projectGenerator exit code: $LASTEXITCODE"
          $vcx = Join-Path $app "Magic-Sand.vcxproj"
          if (-not (Test-Path $vcx)) {
            Write-Error "projectGenerator did not produce Magic-Sand.vcxproj"
            Get-ChildItem $app
            exit 1
          }
          # Re-inject the one def PG can't know about: dlib needs std::binary_function
          # (_HAS_AUTO_PTR_ETC) under C++17. Do NOT define _WINSOCKAPI_ project-wide —
          # it would guard winsock out of ofxKinect's libfreenect/core.c (undefined
          # 'struct timeval'). The winsock 1/2 conflict is instead handled per-file:
          # Bridge.cpp includes <winsock2.h> first and Bridge.h is socket-header-free.
          $raw = Get-Content $vcx -Raw
          $raw = $raw -replace '<PreprocessorDefinitions>', '<PreprocessorDefinitions>_HAS_AUTO_PTR_ETC=1;'
          Set-Content $vcx $raw
          if (-not (Select-String -Path $vcx -Pattern '_HAS_AUTO_PTR_ETC=1' -Quiet)) {
            Write-Error "Failed to inject preprocessor defs into Magic-Sand.vcxproj"; exit 1
          }
          if (Select-String -Path $vcx -Pattern '_WINSOCKAPI_' -Quiet) {
            Write-Error "_WINSOCKAPI_ leaked into Magic-Sand.vcxproj — would break libfreenect/core.c"; exit 1
          }
          Write-Host "Re-injected _HAS_AUTO_PTR_ETC into Magic-Sand.vcxproj"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build x64 Release
        shell: cmd
        run: |
          cd openFrameworks\apps\myApps\Magic-Sand
          msbuild Magic-Sand.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      - name: Package release
        shell: powershell
        run: |
          $binDir = "openFrameworks\apps\myApps\Magic-Sand\bin"
          
          # Copy OF shared libs needed at runtime
          $ofBinDir = "openFrameworks\libs\openFrameworksCompiled\lib\vs\x64\Release"
          if (Test-Path $ofBinDir) {
            Get-ChildItem "$ofBinDir\*.dll" | Copy-Item -Destination $binDir
          }

          # Copy addon runtime DLLs (libusb for Kinect, OpenCV 4 for ofxCv/ofxOpenCv)
          foreach ($addon in @("ofxKinect","ofxOpenCv","ofxCv")) {
            $dlls = Get-ChildItem "openFrameworks\addons\$addon" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" }
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName -Destination $binDir -ErrorAction SilentlyContinue
            }
          }

          Write-Host "=== bin\ contents (verify exe + runtime DLLs present) ==="
          Get-ChildItem $binDir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          if (-not (Test-Path "$binDir\Magic-Sand.exe")) {
            Write-Error "Build did not produce Magic-Sand.exe"; exit 1
          }

          # Create zip
          Compress-Archive -Path "$binDir\*" -DestinationPath "DuneBox-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DuneBox-windows-x64
          path: DuneBox-windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: DuneBox-windows-x64.zip
          generate_release_notes: true

  # Cross-platform compile coverage. These jobs build the app from source with
  # OpenFrameworks' template Makefiles (no projectGenerator needed) to catch
  # portability regressions early. They do not package or publish releases —
  # Windows remains the only release target (the mini PC runs Windows).
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout DuneBox
        uses: actions/checkout@v5
        with:
          path: project
          lfs: true

      - name: Cache OpenFrameworks
        id: cache-of
        uses: actions/cache@v5
        with:
          path: openFrameworks
          key: of-${{ env.OF_VERSION }}-linux64

      - name: Download OpenFrameworks
        if: steps.cache-of.outputs.cache-hit != 'true'
        run: |
          set -e
          url="https://github.com/openframeworks/openFrameworks/releases/download/${OF_VERSION}/of_v${OF_VERSION}_linux64gcc6_release.tar.gz"
          curl -fL "$url" -o of.tar.gz
          mkdir of_temp && tar xzf of.tar.gz -C of_temp
          mv of_temp/* openFrameworks
          rm -rf of_temp of.tar.gz

      - name: Install OF system dependencies
        run: |
          set -e
          # The GitHub ubuntu-22.04 image ships a libunwind that holds back
          # libgstreamer1.0-dev (an OF dependency); install it explicitly first
          # so OF's install_dependencies.sh can resolve gstreamer.
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          cd openFrameworks/scripts/linux/ubuntu
          sudo DEBIAN_FRONTEND=noninteractive ./install_dependencies.sh -y

      - name: Install addons
        shell: bash
        run: |
          set -e
          cd openFrameworks/addons
          rm -rf ofxCv ofxDatGui ofxParagraph ofxModal
          clone_pin() { git clone -q "https://github.com/$1" "$2" && git -C "$2" checkout -q "$3"; }
          clone_pin kylemcdonald/ofxCv        ofxCv        209a3986a8f8e1928c7a11f6e1c5d8ea5406e639
          clone_pin braitsch/ofxParagraph     ofxParagraph 41dbfd2e07e00e358629d470dd1b6f986dee2b70
          clone_pin braitsch/ofxModal         ofxModal     71bfaa283407bbe58b921fd581d8665f21cf5eb8
          clone_pin thomwolf/ofxDatGui        ofxDatGui    0c2230afa68fe5dea822932f6b4c178778af9440
          # OF 0.12 dropped `using namespace std;` from its headers; re-add it to
          # the 0.9-era ofxDatGui headers. perl keeps this portable across the
          # GNU (Linux) and BSD (macOS) userlands.
          find ofxDatGui/src -name '*.h' -print0 \
            | xargs -0 perl -i -pe 's/#pragma once/#pragma once\nusing namespace std;/'
          # ofxCv's Tracker.h declares its constructor with the non-standard
          # injected-class-name form `Tracker<T>()`, which GCC/Clang reject
          # (MSVC tolerates it). Normalise to the legal `Tracker()` spelling.
          perl -i -pe 's/\bTracker<T>\s*\(\)/Tracker()/g' \
            ofxCv/libs/ofxCv/include/ofxCv/Tracker.h

      - name: Place project + template makefiles
        shell: bash
        run: |
          set -e
          mkdir -p openFrameworks/apps/myApps
          cp -r project openFrameworks/apps/myApps/Magic-Sand
          cd openFrameworks/apps/myApps/Magic-Sand
          # Use OF's stock Makefile/config.make so we build without projectGenerator.
          cp ../../../scripts/templates/linux64/Makefile .
          cp ../../../scripts/templates/linux64/config.make .

      - name: Build Release
        shell: bash
        run: |
          set -e
          cd openFrameworks/apps/myApps/Magic-Sand
          make -j"$(nproc)" Release

      - name: Verify binary
        shell: bash
        run: |
          set -e
          cd openFrameworks/apps/myApps/Magic-Sand
          ls -la bin/
          test -f bin/Magic-Sand

  # macOS is expensive on private runners (10x minutes), so build it only on
  # demand (manual dispatch) and on release tags, not every push/PR.
  build-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - name: Checkout DuneBox
        uses: actions/checkout@v5
        with:
          path: project
          lfs: true

      - name: Cache OpenFrameworks
        id: cache-of
        uses: actions/cache@v5
        with:
          path: openFrameworks
          key: of-${{ env.OF_VERSION }}-osx

      - name: Download OpenFrameworks
        if: steps.cache-of.outputs.cache-hit != 'true'
        run: |
          set -e
          url="https://github.com/openframeworks/openFrameworks/releases/download/${OF_VERSION}/of_v${OF_VERSION}_osx_release.zip"
          curl -fL "$url" -o of.zip
          mkdir of_temp && unzip -q of.zip -d of_temp
          mv of_temp/* openFrameworks
          rm -rf of_temp of.zip

      - name: Install addons
        shell: bash
        run: |
          set -e
          cd openFrameworks/addons
          rm -rf ofxCv ofxDatGui ofxParagraph ofxModal
          clone_pin() { git clone -q "https://github.com/$1" "$2" && git -C "$2" checkout -q "$3"; }
          clone_pin kylemcdonald/ofxCv        ofxCv        209a3986a8f8e1928c7a11f6e1c5d8ea5406e639
          clone_pin braitsch/ofxParagraph     ofxParagraph 41dbfd2e07e00e358629d470dd1b6f986dee2b70
          clone_pin braitsch/ofxModal         ofxModal     71bfaa283407bbe58b921fd581d8665f21cf5eb8
          clone_pin thomwolf/ofxDatGui        ofxDatGui    0c2230afa68fe5dea822932f6b4c178778af9440
          find ofxDatGui/src -name '*.h' -print0 \
            | xargs -0 perl -i -pe 's/#pragma once/#pragma once\nusing namespace std;/'
          # ofxCv's Tracker.h declares its constructor with the non-standard
          # injected-class-name form `Tracker<T>()`, which GCC/Clang reject
          # (MSVC tolerates it). Normalise to the legal `Tracker()` spelling.
          perl -i -pe 's/\bTracker<T>\s*\(\)/Tracker()/g' \
            ofxCv/libs/ofxCv/include/ofxCv/Tracker.h

      - name: Place project + template makefiles
        shell: bash
        run: |
          set -e
          mkdir -p openFrameworks/apps/myApps
          cp -r project openFrameworks/apps/myApps/Magic-Sand
          cd openFrameworks/apps/myApps/Magic-Sand
          cp ../../../scripts/templates/osx/Makefile .
          cp ../../../scripts/templates/osx/config.make .

      - name: Build Release
        shell: bash
        run: |
          set -e
          cd openFrameworks/apps/myApps/Magic-Sand
          make -j"$(sysctl -n hw.ncpu)" Release

      - name: Verify binary
        shell: bash
        run: |
          set -e
          cd openFrameworks/apps/myApps/Magic-Sand
          ls -la bin/
          test -e bin/Magic-Sand.app -o -f bin/Magic-Sand
